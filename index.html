<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PulseSync Track</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 560px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;

            background: rgba(15, 15, 18, 0.94);
            border-radius: 14px;

            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.35);
        }

        .cover {
            width: 80px;
            height: 80px;

            object-fit: cover;
            border-radius: 10px;

            background: #333;
            flex-shrink: 0;
        }

        .info {
            min-width: 0;
            flex: 1;
        }

        .artist {
            font-size: 15px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title {
            margin-top: 4px;

            font-size: 21px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            border: none;
            border-radius: 8px;

            padding: 8px 11px;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;
        }

        .open {
            background: white;
            color: #111;
        }

        .copy {
            background: #38383f;
            color: white;
        }

        .status {
            margin-top: 7px;

            font-size: 11px;
            color: #aaa;
        }

        .error {
            padding: 20px;

            background: rgba(15, 15, 18, 0.94);
            border-radius: 14px;

            color: #aaa;
        }
    </style>
</head>

<body>

<div id="app">
    <div class="error">
        Загружаю трек...
    </div>
</div>


<script>

let currentTrack = null;


// --------------------------------------------------
// Безопасный вывод текста
// --------------------------------------------------

function escapeHtml(text) {

    return String(text).replace(/[&<>"']/g, function (char) {

        const symbols = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        };

        return symbols[char];
    });
}


// --------------------------------------------------
// Получаем ссылку на трек Яндекс Музыки
// --------------------------------------------------

function getTrackUrl(track) {

    const albumId =
        track?.albums?.[0]?.id;

    const trackId =
        track?.realId ||
        track?.id;

    if (!albumId || !trackId) {
        return "";
    }

    return `https://music.yandex.ru/album/${albumId}/track/${trackId}`;
}


// --------------------------------------------------
// Получаем обложку
// --------------------------------------------------

function getCoverUrl(track) {

    const uri =
        track?.coverUri ||
        track?.albums?.[0]?.coverUri;

    if (!uri) {
        return "";
    }

    return uri.replace("%%", "200x200");
}


// --------------------------------------------------
// Открыть песню
// --------------------------------------------------

function openTrack() {

    if (!currentTrack?.url) {
        return;
    }

    window.open(
        currentTrack.url,
        "_blank"
    );
}


// --------------------------------------------------
// Скопировать название
// --------------------------------------------------

async function copyTrack() {

    if (!currentTrack) {
        return;
    }

    const text =
        `${currentTrack.artist} — ${currentTrack.title}`;

    try {

        await navigator.clipboard.writeText(text);

    } catch (error) {

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();
    }
}


// --------------------------------------------------
// Получить текущий трек
// --------------------------------------------------

async function updateTrack() {

    try {

        const response =
            await fetch(
                "/track",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            throw new Error(
                "Сервер не отвечает"
            );
        }


        const data =
            await response.json();


        const track =
            data.track;


        if (!track) {

            document.getElementById("app").innerHTML = `
                <div class="error">
                    Сейчас ничего не играет
                </div>
            `;

            return;
        }


        const artist =
            (track.artists || [])
                .map(
                    artist => artist.name
                )
                .join(", ");


        const title =
            track.title ||
            "Без названия";


        const url =
            getTrackUrl(track);


        const cover =
            getCoverUrl(track);


        currentTrack = {

            artist: artist,

            title: title,

            url: url
        };


        document.getElementById("app").innerHTML = `

            <div class="card">

                <img
                    class="cover"
                    src="${cover}"
                    onerror="this.style.visibility='hidden'"
                >

                <div class="info">

                    <div class="artist">
                        ${escapeHtml(artist)}
                    </div>

                    <div class="title">
                        ${escapeHtml(title)}
                    </div>


                    <div class="buttons">

                        <button
                            class="open"
                            onclick="openTrack()"
                        >
                            🎧 Открыть в Яндекс Музыке
                        </button>


                        <button
                            class="copy"
                            onclick="copyTrack()"
                        >
                            📋 Скопировать
                        </button>

                    </div>


                    <div class="status">

                        ${
                            data.status === "playing"
                            ? "▶ Сейчас играет"
                            : "⏸ Пауза"
                        }

                    </div>

                </div>

            </div>
        `;


    } catch (error) {

        document.getElementById("app").innerHTML = `

            <div class="error">

                ❌ Не удалось получить данные
                от PulseSync

            </div>

        `;
    }
}


// --------------------------------------------------
// Запуск
// --------------------------------------------------

updateTrack();


// Проверяем новый трек каждые 2 секунды

setInterval(
    updateTrack,
    2000
);

</script>

</body>
</html>
